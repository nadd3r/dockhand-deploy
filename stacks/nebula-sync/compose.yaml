---
services:
  nebula-sync:
    image: ghcr.io/lovelaze/nebula-sync:latest
    container_name: nebula-sync
    dns:
    - 192.168.54.2
    - 192.168.54.3
    environment:
    - PRIMARY=https://${PRIMARY_PI}|${PRIMARY_PASS}
    - REPLICAS=https://${SECONDARY_PI}|${SECONDARY_PASS}
    - FULL_SYNC=true
    - RUN_GRAVITY=true
    - CRON=0 * * * *